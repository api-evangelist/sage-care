aid: sage-care
name: Sage Care
description: >-
  Sage Care (sagecare.ai) builds an AI-native, HIPAA-compliant software platform
  made exclusively for home care agencies. Its product bundles an AI receptionist,
  a purpose-built CRM, an AI notetaker and a clinical scribe that automate the
  intake, referral, scheduling and documentation work that home care operators
  handle every day. Sage Care integrates with existing home care management
  systems such as WellSky and AxisCare rather than replacing them, and ships
  native iOS and desktop applications for caregivers and office staff. The company
  is backed by General Catalyst and surfaced through its portfolio. As of this
  enrichment pass Sage Care publishes no public developer API, OpenAPI/AsyncAPI
  specification, SDKs, or developer documentation — it is an application vendor
  rather than an API provider, so this profile captures company identity and
  security/compliance posture only.
